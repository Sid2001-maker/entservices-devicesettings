hdmiinput:
  command: aviinfo_frame
  description: Simulate an AVI InfoFrame with content type GAME (ITC=1, CN=3) on port 0.
  params:
    port: 0
    # Byte 5 carries ITC/CN content-type bits; 0x30 => Game content type.
    data: [0x82, 0x02, 0x0D, 0x6F, 0x30, 0x18, 0x28, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
