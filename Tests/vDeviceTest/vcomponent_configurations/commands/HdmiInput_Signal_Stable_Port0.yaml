hdmiinput:
  command: signal_status
  description: Simulate a stable (LOCKED) HDMI signal on port 0.
  params:
    port: 0
    state: LOCKED # Possible values: UNKNOWN, NO_SIGNAL, UNSTABLE, NOT_SUPPORTED, LOCKED
